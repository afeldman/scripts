name: shellcheck

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck on bash/sh scripts
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          check_together: "yes"
        env:
          SHELLCHECK_OPTS: >
            --shell=bash
            --exclude=SC1090,SC1091

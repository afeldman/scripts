name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Formula
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          TAG="${{ github.ref_name }}"
          TARBALL_URL="https://github.com/afeldman/scripts/archive/refs/tags/${TAG}.tar.gz"

          sleep 10
          SHA256=$(curl -fsSL "$TARBALL_URL" | shasum -a 256 | awk '{print $1}')

          sed -i "s|url \".*\"|url \"${TARBALL_URL}\"|" Formula/scripts.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA256}\"|" Formula/scripts.rb
          sed -i "s|version \".*\"|version \"${VERSION}\"|" Formula/scripts.rb

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Formula/scripts.rb
          git diff --cached --quiet || git commit -m "chore: update formula to ${TAG}"
          git push origin HEAD:master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-fish-food:
    needs: [release]
    uses: afeldman/fish-food/.github/workflows/update-food-bash.yml@master
    with:
      name: scripts
      version: ${{ github.ref_name }}
      description: "Personal utility scripts for macOS and Linux"
      github_repo: afeldman/scripts
      resources: "gotofish,encrypt,decrypt,encryptdir,decryptdir,2pem,pfx2cert,passgen,cp_n,dublicate,dublicate_dir,githelper,git-blame-someone-else,update,scripts-update,remote_cmd,calc,pretty_json,tomlq,xq,checksumdir,chkfilehash"
    secrets:
      fish_food_token: ${{ secrets.FISH_FOOD_TOKEN }}
